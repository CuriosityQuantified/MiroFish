name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio
          # Install core deps (skip heavy CAMEL-AI/OASIS for CI speed)
          pip install flask flask-cors openai pydantic>=2.0.0 python-dotenv mcp[cli]>=1.0.0
          # Graphiti + Kuzu
          pip install "graphiti-core[kuzu,anthropic]"

      - name: Run tests
        env:
          # Dummy keys so config validation doesn't fail on import
          ANTHROPIC_API_KEY: test-key-ci
          LLM_PROVIDER: anthropic
        run: |
          pytest tests/ -v --tb=short
